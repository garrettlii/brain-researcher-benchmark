version = "1.1"
instruction_version = "1.0"
test_version = "1.0"
artifacts = ["/app/output"]

[metadata]
task_id = "CAPPAC-001"
# Metadata is for maintainers; the agent sees only instruction.md.
title = "Reproduce Yeh & Shi 2018's CAP phase-A coupling ordering (A1 > A2 > A3): un-cued segment-length bias of the modulation index"
category = "EEG"
# Target difficulty; not yet measured (Harbor oracle and frontier-agent calibration pending).
difficulty = "hard"
dataset_source = "PhysioNet CAP Sleep Database 1.0.0 (ODC-By 1.0): 16 healthy-control EDF recordings and RemLogic event exports, staged and sha256-checked at image build; offline runtime"
dataset_id = "capslpdb-1.0.0-n1-n16"
source_paper = "Yeh & Shi 2018, Sci Rep 8:3049 (10.1038/s41598-018-21013-9)"

# Reference solution: 46 s locally (Apple M-series, 2 processes, ~60 CPU-s, ~1.6 GB per
# process), so a few minutes on the container's 2 CPUs. Staging downloads 3.8 GB at build time.
# Verifier: <1 s (reads the outputs, no recomputation). Neither has run in the container yet.
[verifier]
timeout_sec = 600.0

[agent]
timeout_sec = 3600.0

[environment]
build_timeout_sec = 3600.0
cpus = 2
memory_mb = 8192
storage_mb = 16384
gpus = 0
allow_internet = false

[verifier.env]

[solution.env]
